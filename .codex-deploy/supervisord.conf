[unix_http_server]
file=/home/daytona/sendkeep/runtime/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/daytona/sendkeep/runtime/supervisord.log
pidfile=/home/daytona/sendkeep/runtime/supervisord.pid
childlogdir=/home/daytona/sendkeep/runtime

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/daytona/sendkeep/runtime/supervisor.sock

[program:sendkeep-web]
directory=/home/daytona/sendkeep
command=/home/daytona/sendkeep/.venv/bin/python -m uvicorn server:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/daytona/sendkeep/runtime/web.log
stderr_logfile=/home/daytona/sendkeep/runtime/web.err.log
environment=PYTHONUNBUFFERED="1",WEB_CONCURRENCY="1"

[program:sendkeep-worker]
directory=/home/daytona/sendkeep/outreach-agent
command=/home/daytona/sendkeep/.venv/bin/python watch_replies.py
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/daytona/sendkeep/runtime/worker.log
stderr_logfile=/home/daytona/sendkeep/runtime/worker.err.log
environment=PYTHONUNBUFFERED="1"
